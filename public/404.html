<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>REM-NE</title>
    <script>
      // Redireciona para index.html preservando o path original.
      // Necessario para SPAs em GitHub Pages: o servidor retorna este
      // 404.html e o script converte o path em query string para que
      // index.html possa restaurar a rota correta no client.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
